[project]
name = "onye-ehr-intelligence"
version = "0.1.0"
description = "Clinical EHR Media Ingestion, FHIR R4 Normalization, AI Summarization & Semantic Search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "fhir.resources>=7.0.0",
    "sentence-transformers>=2.5.0",
    "chromadb>=0.4.22",
    "python-dotenv>=1.0.0",
    "httpx>=0.27.0",
    "reportlab>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
